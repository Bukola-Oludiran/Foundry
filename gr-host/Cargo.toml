# Foundry control-plane workspace (Rust). Path-depends into the GraphReact substrate.
# M2 = foundry-ir (deterministic IR→DAG compiler). M3 will add foundry-host (the bin
# embedding graphreact-core).
[workspace]
resolver = "2"
members = ["crates/foundry-ir", "crates/foundry-host"]

[workspace.package]
version = "0.0.0"
edition = "2021"

[workspace.dependencies]
# Substrate: pin the exact GraphReact revision used by CI and production builds.
# Contributors working on both repositories can override these with Cargo's
# `--config patch` mechanism without weakening the committed reproducibility.
graphreact-algorithms = { git = "https://github.com/Bukola-Oludiran/GraphReact.git", rev = "435d5ef7a9c7651fb74d9cc390479f68ce10c67f" }
graphreact-core = { git = "https://github.com/Bukola-Oludiran/GraphReact.git", rev = "435d5ef7a9c7651fb74d9cc390479f68ce10c67f" }
graphreact-durable-runtime = { git = "https://github.com/Bukola-Oludiran/GraphReact.git", rev = "435d5ef7a9c7651fb74d9cc390479f68ce10c67f" }
graphreact-persistence = { git = "https://github.com/Bukola-Oludiran/GraphReact.git", rev = "435d5ef7a9c7651fb74d9cc390479f68ce10c67f" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
indexmap = "2"
sha2 = "0.10"
futures = "0.3"
libc = "0.2"
axum = "0.8"
base64 = "0.22"
nostr = "0.44"
reqwest = { version = "0.13", features = ["blocking", "json", "rustls"] }
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal"] }
