# Foundry control-plane workspace (Rust). Path-depends into the GraphReact substrate.
# M2 = foundry-ir (deterministic IR→DAG compiler). M3 will add foundry-host (the bin
# embedding graphreact-core).
[workspace]
resolver = "2"
members = ["crates/foundry-ir", "crates/foundry-engine", "crates/foundry-host"]

[workspace.package]
version = "0.0.0"
edition = "2021"

[workspace.dependencies]
# Substrate: pure graph algorithms for the compiler; core runtime for the host.
graphreact-algorithms = { path = "../../GraphReact/graphreactRust/crates/graphreact-algorithms" }
graphreact-core = { path = "../../GraphReact/graphreactRust/crates/graphreact-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
indexmap = "2"
