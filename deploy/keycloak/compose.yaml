name: foundry-keycloak

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: foundry-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: foundry-admin-test-only
      JAVA_OPTS_KC_HEAP: -Xms64m -Xmx256m -XX:MaxMetaspaceSize=192m
    volumes:
      - ./realm.json:/opt/keycloak/data/import/foundry-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /realms/master HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '\"realm\":\"master\"' <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
