name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:mcp
      - run: npm audit --audit-level=high

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gr-host
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gr-host
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pi-pool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: pi-pool/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run validate:oci
        env:
          FOUNDRY_SANDBOX: oci
          FOUNDRY_ALLOW_ROOTFUL_OCI: "1"
      - run: npm run validate:build
        env:
          FOUNDRY_SANDBOX: oci
          FOUNDRY_ALLOW_ROOTFUL_OCI: "1"

  durable-restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: pi-pool/package-lock.json
      - run: npm ci
        working-directory: pi-pool
      - run: cargo build --manifest-path gr-host/Cargo.toml --locked
      - run: npm run validate:durable-restart
        working-directory: pi-pool
        env:
          FOUNDRY_SANDBOX: oci
          FOUNDRY_ALLOW_ROOTFUL_OCI: "1"
